<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Message</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8d7e8, #fdf6f9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .card {
      background: white;
      max-width: 420px;
      width: 100%;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 14px;
      background: #d96b9f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c8568b;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c0392b;
      margin-top: 12px;
      font-size: 14px;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    .small-note {
      margin-top: 18px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="lock-screen">
      <h1>For You 🤍</h1>
      <p>This message is locked. Enter the password to open it.</p>

      <input id="passwordInput" type="password" placeholder="Enter password" />
      <button onclick="checkPassword()">Unlock Message</button>

      <div id="errorMessage" class="error hidden">Wrong password. Try again.</div>
    </div>

    <div id="message-screen" class="hidden">
      <h1>Unlocked 🤍</h1>
      <p>Here is your private voice message.</p>

      <!-- Replace the link below with your direct audio file link -->
      <a href="https://drive.google.com/drive/folders/1A0e5g8AFqqGmLBPRJM3RVKgij-hgrtw6\?usp=drive_link" target="_blank">
  Open Your Message 🤍
</a>

      <p class="small-note">You can replay it anytime from this page.</p>
    </div>
  </div>

  <script>
    // Change this to whatever password you want
    const correctPassword = "moon";

    function checkPassword() {
      const enteredPassword = document.getElementById("passwordInput").value.trim();
      const errorMessage = document.getElementById("errorMessage");
      const lockScreen = document.getElementById("lock-screen");
      const messageScreen = document.getElementById("message-screen");

      if (enteredPassword === correctPassword) {
        lockScreen.classList.add("hidden");
        messageScreen.classList.remove("hidden");
      } else {
        errorMessage.classList.remove("hidden");
      }
    }

    document.getElementById("passwordInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>
</body>
</html>
